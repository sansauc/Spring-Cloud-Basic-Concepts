spring:
  application:
    name: service-registry

server:
  port: 8761

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Solo para desarrollo: responde siempre con el registro actualizado
    # (por defecto usa una caché de lectura que se refresca cada 30s)
    use-read-only-response-cache: false
